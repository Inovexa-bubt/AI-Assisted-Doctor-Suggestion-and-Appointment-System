ay-doe" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan x="336" y="969.7">Removing a leave day does not restore cancelled bookings.</tspan></text><g id="top-bar"><rect x="64" y="214" width="1440" height="64" fill="#FFFFFF"/><line x1="64" y1="278" x2="1504" y2="278" stroke="#E0E0E0" stroke-width="1"/><rect x="80" y="228" width="36" height="36" rx="8" fill="#3B3B3B"/><svg id="icon-Plus" x="88" y="236" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><text id="text-Lumina-Specialized-Hospi" x="128" y="244" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Lumina Specialized Hospital</text><text id="text-Staff-portal" x="128" y="262" font-family="Inter" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start">Staff portal</text><text id="text-Sign-out" x="1423.6" y="251" font-family="Inter" font-size="14" font-weight="500" fill="#5C5C5C" text-anchor="start">Sign out</text><svg id="icon-LogOut" x="1399.6" y="237" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path></svg><text id="text-2" x="1338.4" y="251" font-family="Hind Siliguri" font-size="14" font-weight="500" fill="#5C5C5C" text-anchor="start">বাংলা</text><svg id="icon-Languages" x="1314.4" y="237" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg><g id="chip-Admin-2"><rect x="1235.3" y="235" width="55.1" height="22" rx="11" fill