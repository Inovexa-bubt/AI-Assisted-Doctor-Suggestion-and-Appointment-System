02.3">stay for the record. Patients see the day as “On</tspan><tspan x="1618" y="424.8">leave”.</tspan></text></g><g id="note-markers"><g id="note-2"><circle cx="1220" cy="512.6" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="1220" y="516.8" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text></g><g id="note-1"><circle cx="1240" cy="365.6" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="1240" y="369.8" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text></g><g id="note-3"><circle cx="1240" cy="656.9" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="1240" y="661.1" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text></g></g></g></svg>