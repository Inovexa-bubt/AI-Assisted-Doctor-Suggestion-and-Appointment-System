 fill="#1F1F1F" text-anchor="start"><tspan x="568" y="292.8">Weekly chamber times and room.</tspan></text><g id="note-3-2"><circle cx="545" cy="330" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="545" y="334.2" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text></g><text id="text-The-next-14-days-an-adm" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="568" y="334.8">The next 14 days (an admin setting). Each day</tspan><tspan x="568" y="357.3">shows how many slots are free. Days without a</tspan><tspan x="568" y="379.8">chamber, or with a leave day, cannot be picked.</tspan></text><g id="note-4-2"><circle cx="545" cy="415.5" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="545" y="419.7" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text></g><text id="text-Slots-follow-the-chamber" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="568" y="420.3">Slots follow the chamber’s minutes per patient (12</tspan><tspan x="568" y="442.8">here). Taken slots are crossed out. The serial</tspan><tspan x="568" y="465.3">number is the slot’s position in the session.</tspan></text><g id="note-5-2"><circle cx="545" cy="501" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="545" y="505.2" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text></g><text id="text-Book-this-slot-patients" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="568" y="505.8">Book this slot: patients who are not signed in sign in</tspan><tspan x="568" y="528.3">first, then the slot is held for them for 5 minutes.</tspan></text></g><g id="note-markers"><g id="note-1"><circle cx="442" cy="336.3" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="442" y="340.5" font-family="I