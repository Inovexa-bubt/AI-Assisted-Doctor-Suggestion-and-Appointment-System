<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1178" viewBox="0 0 2048 1178"><g id="S1 Staff sign-in"><rect id="background" x="0" y="0" width="2048" height="1178" fill="#FFFFFF"/><text id="title" x="64" y="98" font-family="Inter" font-size="36" font-weight="700" fill="#1F1F1F" text-anchor="start">S1  Staff sign-in</text><text id="text-Route-stafflogin-One" font-family="Inter" font-size="17" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan x="64" y="135.8">Route /staff/login. One sign-in for admins, front-desk staff and doctors.</tspan></text><text id="meta" x="1984" y="94" font-family="Inter" font-size="13" font-weight="400" fill="#8F8F8F" text-anchor="end">Lumina Specialized Hospital · UI wireframes v0.1 · October 2026</text><text id="caption-Sign-in" x="64" y="194" font-family="Inter" font-size="16" font-weight="600" fill="#5C5C5C" text-anchor="start">Sign in</text><g id="desktop-screen"><rect x="64" y="214" width="1440" height="900" fill="#F6F6F6" stroke="#9A9A9A" stroke-width="1.5"/><g id="box"><rect x="564" y="334" width="440" height="605.5" rx="16" fill="#FFFFFF" stroke="#C4C4C4" stroke-width="1"/><rect x="592" y="363" width="40" height="40" rx="8" fill="#3B3B3B"/><svg id="icon-Plus-2" x="601" y="372" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><text id="text-Lumina-Specialized-Hospi-2" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start"><tspan x="644" y="378.4">Lumina Specialized Hospital</tspan></text><text id="text-Staff-portal-2" font-family="Inter" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan x="644" y="398.5">Staff portal</tspan></text><text id="text-Staff-sign-in" font-family="Inter" font-size="22" font-weight="700" fill="#1F1F1F" text-anchor="start"><tspan x="592" y="442.6">Staff sign-in</tspan></text><text id="text