nvir</text></g><g id="button-Patient-site"><text id="label-Patient-site" x="594" y="904.4" font-family="Inter" font-size="14" font-weight="600" fill="#1F1F1F" text-decoration="underline">Patient site</text></g></g></g><g id="notes"><text id="text-Notes" x="1584" y="194" font-family="Inter" font-size="16" font-weight="600" fill="#5C5C5C" text-anchor="start">Notes</text><g id="note-1-2"><circle cx="1595" cy="225" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="1595" y="229.2" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text></g><text id="text-Username-and-password-E" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="1618" y="229.8">Username and password. Each role lands on its own</tspan><tspan x="1618" y="252.3">home page and sees only its own pages: admin</tspan><tspan x="1618" y="274.8">everything, front desk the front desk, doctors their</tspan><tspan x="1618" y="297.3">own patients.</tspan></text><g id="note-2-2"><circle cx="1595" cy="333" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="1595" y="337.2" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text></g><text id="text-Milestone-1-demo-only-o" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="1618" y="337.8">Milestone 1 demo only: one click fills a demo</tspan><tspan x="1618" y="360.3">account.</tspan></text></g><g id="note-markers"><g id="note-1"><circle cx="980" cy="469.9" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="980" y="474.1" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text></g><g id="note-2"><circle cx="980" cy="716.6" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="980" y="720.9" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text></g></g></g></svg>