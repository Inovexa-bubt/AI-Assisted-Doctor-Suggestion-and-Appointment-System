<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1340" viewBox="0 0 2000 1340"><g id="00 Cover"><rect id="background" x="0" y="0" width="2000" height="1340" fill="#FFFFFF"/><text id="title" x="80" y="120" font-family="Inter" font-size="56" font-weight="700" fill="#1F1F1F" text-anchor="start">UI wireframes</text><text id="text-AI-Assisted-Doctor-Sugge" font-family="Inter" font-size="24" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan x="80" y="168.6">AI-Assisted Doctor Suggestion and Appointment System · Lumina Specialized Hospital</tspan></text><text id="text-Version-01-5-October" x="80" y="220" font-family="Inter" font-size="16" font-weight="400" fill="#8F8F8F" text-anchor="start">Version 0.1 · 5 October 2026 · Prepared by Inovexa</text><text id="text-Low-fidelity-layouts-of" font-family="Inter" font-size="17" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="80" y="268.3">Low-fidelity layouts of every screen for the Milestone 1 review. They show what is on each screen and how it behaves, not the final look.</tspan><tspan x="80" y="294.6">The running demo (npm run dev) shows the same screens with real styling and sample data.</tspan></text><text id="text-How-to-read-the-boards" x="80" y="370" font-family="Inter" font-size="22" font-weight="700" fill="#1F1F1F" text-anchor="start">How to read the boards</text><g id="note-1"><circle cx="92" cy="412" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/><text x="92" y="416.2" font-family="Inter" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text></g><text id="text-Numbered-note-Explained" x="380" y="417" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start">Numbered note. Explained in the Notes column of the same board.</text><g id="button-Main-action"><rect x="80" y="442" width="122.1" height="44" rx="10" fill="#3B3B3B"/><text id="label-Main-action" x="96" y="469.3" font-family="Inter" font-size="15" font-weight="600" fill="#FFFFFF">Main action</text></g><text id="text-Primary-action-on-the-sc" x="380" y="469" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start">Primary action on the screen.</text><g id="button-Other-action"><rect x="80" y="504" width="127" height="44" rx="10" fill="#FFFFFF" stroke="#3B3B3B" stroke-width="1.5"/><text id="label-Other-action" x="96" y="531.3" font-family="Inter" font-size="15" font-weight="600" fill="#1F1F1F">Other action</text></g><text id="text-Secondary-action" x="380" y="531" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start">Secondary action.</text><g id="button-Link"><text id="label-Link" x="82" y="583.3" font-family="Inter" font-size="15" font-weight="600" fill="#1F1F1F" text-decoration="underline">Link</text></g><text id="text-Link-to-another-screen" x="380" y="583" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start">Link to another screen.</text><g id="chip-Booked-4"><rect x="80" y="608" width="61.7" height="22" rx="11" fill="#E2E2E2"/><text id="chip-Booked-3" x="89" y="623" font-family="Inter" font-size="12" font-weight="500" fill="#1F1F1F">Booked</text></g><g id="chip-With-the-doctor-4"><rect x="147.7" y="608" width="107.3" height="22" rx="11" fill="#3B3B3B"/><text id="chip-With-the-doctor-3" x="156.7" y="623" font-family="Inter" font-size="12" font-weight="500" fill="#FFFFFF">With the doctor</text></g><g id="chip-Summary-4"><rect x="261" y="608" width="92.4" height="22" rx="11" fill="#FFFFFF" stroke="#8F8F8F" stroke-width="1" stroke-dasharray="3 2"/><svg id="icon-ChevronDown-2" x="270" y="612" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg><text id="chip-Summary-3" x="288" y="623" font-family="Inter" font-size="12" font-weight="500" fill="#5C5C5C">Summary</text></g><text id="text-Status-labels-and-expand" x="380" y="625" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start">Status labels and expandable details.</text><rect x="80" y="650" width="96" height="40" rx="8" fill="#EFEFEF" stroke="#C4C4C4" stroke-width="1"/><text id="text-512-PM" font-family="Inter" font-size="14" font-weight="400" fill="#8F8F8F" text-anchor="middle"><tspan x="128" y="674.4">5:12 PM</tspan></text><line x1="100.8" y1="669.9" x2="155.2" y2="669.9" stroke="#8F8F8F" stroke-width="1"/><text id="text-Not-available-taken-slo" x="380" y="675" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start">Not available (taken slot, day off).</text><text id="text-On-every-screen" x="1060" y="370" font-family="Inter" font-size="22" font-weight="700" fill="#1F1F1F" text-anchor="start">On every screen</text><circle cx="1065" cy="411" r="3" fill="#1F1F1F"/><text id="text-Bangla-and-English-swit-2" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="1080" y="415.8">Bangla and English, switchable at any time from the header.</tspan></text><circle cx="1065" cy="443.5" r="3" fill="#1F1F1F"/><text id="text-Patient-screens-are-desi-2" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="1080" y="448.3">Patient screens are designed for phones first (drawn at 390 px) and work from 360 px. Staff screens are designed</tspan><tspan x="1080" y="470.8">for a desk computer (drawn at 1440 px) and still work on a tablet.</tspan></text><circle cx="1065" cy="498.5" r="3" fill="#1F1F1F"/><text id="text-Emergency-strip-on-Home-2" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="1080" y="503.3">Emergency strip on Home and the assistant: chest pain, breathing difficulty or heavy bleeding → emergency</tspan><tspan x="1080" y="525.8">department or 999.</tspan></text><circle cx="1065" cy="553.5" r="3" fill="#1F1F1F"/><text id="text-Every-AI-result-says-it-2" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="1080" y="558.3">Every AI result says it is a suggestion of which doctor to see, not a diagnosis.</tspan></text><circle cx="1065" cy="586" r="3" fill="#1F1F1F"/><text id="text-Milestone-1-demo-only-a-2" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="start"><tspan x="1080" y="590.8">Milestone 1 demo only: a top banner says the data is sample data and no SMS is sent, with a reset button.</tspan></text><line x1="80" y1="734" x2="1920" y2="734" stroke="#E0E0E0" stroke-width="1"/><text id="text-Screens" x="80" y="768" font-family="Inter" font-size="22" font-weight="700" fill="#1F1F1F" text-anchor="start">Screens</text><text id="text-Patient-site-phone" x="80" y="808" font-family="Inter" font-size="16" font-weight="600" fill="#5C5C5C" text-anchor="start">Patient site · phone</text><rect x="80" y="830" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P1" x="106" y="849" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P1</text><text id="text-Home" x="148" y="849" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Home</text><text id="text-Start-with-the-assistant" x="209.5" y="849" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Start with the assistant, search, or pick a specialty</text><rect x="80" y="870" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P2" x="106" y="889" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P2</text><text id="text-AI-assistant" x="148" y="889" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">AI assistant</text><text id="text-Describe-the-problem-fo" x="261.5" y="889" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Describe the problem, follow-up questions, suggestion or emergency notice</text><rect x="80" y="910" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P3" x="106" y="929" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P3</text><text id="text-Find-a-doctor" x="148" y="929" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Find a doctor</text><text id="text-Search-and-filter-doctor" x="271.4" y="929" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Search and filter doctors; next open slot on each</text><rect x="80" y="950" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P4" x="106" y="969" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P4</text><text id="text-Doctor-profile-and-slots" x="148" y="969" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Doctor profile and slots</text><text id="text-Chambers-and-every-open" x="355.5" y="969" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Chambers and every open slot for the next 14 days</text><rect x="80" y="990" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P5" x="106" y="1009" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P5</text><text id="text-Sign-in-and-register" x="148" y="1009" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Sign in and register</text><text id="text-Phone-number-and-one-tim" x="322.4" y="1009" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Phone number and one-time code; name, age and sex for new patients</text><rect x="80" y="1030" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P6" x="106" y="1049" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P6</text><text id="text-Confirm-booking" x="148" y="1049" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Confirm booking</text><text id="text-Slot-held-for-5-minutes" x="296.8" y="1049" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Slot held for 5 minutes while the patient confirms</text><rect x="80" y="1070" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P7" x="106" y="1089" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P7</text><text id="text-Booking-confirmed" x="148" y="1089" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Booking confirmed</text><text id="text-Serial-room-and-SMS-con" x="316.6" y="1089" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Serial, room and SMS confirmation</text><rect x="80" y="1110" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P8" x="106" y="1129" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P8</text><text id="text-My-appointments" x="148" y="1129" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">My appointments</text><text id="text-Upcoming-and-past-resch" x="305.1" y="1129" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Upcoming and past; reschedule, cancel, book again</text><rect x="80" y="1150" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-P9" x="106" y="1169" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">P9</text><text id="text-Live-queue" x="148" y="1169" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Live queue</text><text id="text-Now-serving-patients-ah" x="253.3" y="1169" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Now serving, patients ahead, estimated time</text><text id="text-Staff-portal-desktop" x="1060" y="808" font-family="Inter" font-size="16" font-weight="600" fill="#5C5C5C" text-anchor="start">Staff portal · desktop</text><rect x="1060" y="830" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S1" x="1086" y="849" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S1</text><text id="text-Staff-sign-in" x="1128" y="849" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Staff sign-in</text><text id="text-Admins-front-desk-and-d" x="1245" y="849" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Admins, front desk and doctors</text><rect x="1060" y="870" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S2" x="1086" y="889" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S2</text><text id="text-Front-desk" x="1128" y="889" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Front desk</text><text id="text-Check-patients-in-call" x="1231.8" y="889" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Check patients in, call the next one, phone and walk-in booking</text><rect x="1060" y="910" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S3" x="1086" y="929" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S3</text><text id="text-Doctor-view" x="1128" y="929" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Doctor view</text><text id="text-A-doctors-own-list-with" x="1242.3" y="929" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">A doctor’s own list with pre-visit summaries</text><rect x="1060" y="950" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S4" x="1086" y="969" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S4</text><text id="text-Doctors" x="1128" y="969" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Doctors</text><text id="text-Profiles-fees-and-weekl" x="1207.2" y="969" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Profiles, fees and weekly chambers</text><rect x="1060" y="990" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S5" x="1086" y="1009" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S5</text><text id="text-Leave-days" x="1128" y="1009" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Leave days</text><text id="text-Block-a-day-affected-pa" x="1238.3" y="1009" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Block a day; affected patients are cancelled and texted</text><rect x="1060" y="1030" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S6" x="1086" y="1049" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S6</text><text id="text-Specialties" x="1128" y="1049" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Specialties</text><text id="text-Names-descriptions-ord" x="1234.9" y="1049" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Names, descriptions, order</text><rect x="1060" y="1070" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S7" x="1086" y="1089" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S7</text><text id="text-Settings" x="1128" y="1089" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Settings</text><text id="text-Reminder-SMS-time-and-bo" x="1212" y="1089" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Reminder SMS time and booking window</text><rect x="1060" y="1110" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S8" x="1086" y="1129" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S8</text><text id="text-SMS-log" x="1128" y="1129" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">SMS log</text><text id="text-Every-message-the-system" x="1211.5" y="1129" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Every message the system sent</text><rect x="1060" y="1150" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S9" x="1086" y="1169" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S9</text><text id="text-Staff-accounts" x="1128" y="1169" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Staff accounts</text><text id="text-Who-can-sign-in-and-wit" x="1264.9" y="1169" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Who can sign in, and with which role</text><rect x="1060" y="1190" width="52" height="28" rx="6" fill="#E2E2E2"/><text id="text-S10" x="1086" y="1209" font-family="Inter" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">S10</text><text id="text-Analytics" x="1128" y="1209" font-family="Inter" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="start">Analytics</text><text id="text-Bookings-no-shows-spec" x="1220.1" y="1209" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Bookings, no-shows, specialties, peak hours, common problems</text><text id="text-The-Flows-board-shows" x="80" y="1260" font-family="Inter" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">The “Flows” board shows how the screens connect.</text></g></svg>