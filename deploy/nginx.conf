# Nginx reverse-proxy configuration for VPS deployment (docs/design/README.md §2.3)
# Serves the built React SPA and proxies /api and /socket.io to the Node.js API on port 4000.

server {
    listen 80;
    server_name appointments.luminahospital.example;

    # Serve built frontend files (build with VITE_API_MOCK=false npm run build)
    root /var/www/lumina/apps/web/dist;
    index index.html;

    client_max_body_size 12m;

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO live queue (WebSocket + polling)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache fingerprinted Vite assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
