services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina_hospital
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./lumina_hospital_seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumina -d lumina_hospital']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-4000}:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      SERVE_STATIC: 'true'
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      DATABASE_URL: postgres://lumina:${POSTGRES_PASSWORD:-lumina_dev_password}@postgres:5432/lumina_hospital
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      SMS_PROVIDER: ${SMS_PROVIDER:-sandbox}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-LuminaHosp}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      ENABLE_SCHEDULER: 'true'

volumes:
  pgdata:
